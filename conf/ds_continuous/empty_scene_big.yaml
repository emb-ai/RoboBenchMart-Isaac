defaults:
  - main_darkstore_continuous_config_base
  - _self_

name: 'empty_scene_big'
size_x: 17
size_y: 15
num_scenes: 1
num_workers: 1
layout_gen_type: PROCEDURAL_TENSOR_FIELD
randomize_layout: true
randomize_arrangements: true
output_dir: generated_envs/${ds_continuous.name}

inactive_wall_shelvings_occupancy_width: 0.4
inactive_shelvings_occupancy_width: 1.0
fixtures_occupancy_width: 0.2
passage_width: 2.0
inactive_shelvings_skip_prob: 0.1


random_seed: 42


active_shelvings_list:
  - name: 'mixed_shelf'
    filling_type: BOARDWISE_COLUMNS
    x_gap: 0.06
    y_gap: 0.02
    delta_x: 0.1
    shelf_asset: fixtures.shelf_metal
    shuffle_boards: True
    shuffle_items_on_board: True
    board_product_numcol:
      0:
        food.HYGIENE.NiveaBodyMilk: 3 # train
        food.HOUSEHOLD.VanishStainRemover: 4 # test OOD

        food.HOUSEHOLD.AceDetergent: 3 # inactive
      1:
        food.CEREALS.NestleHoneyStars: 3 # train
        food.CEREALS.NestleFitnessChocolateCereals: 4 # test OOD
        
        food.CRACKERS_COOKIES.BananiaCookies: 3 # inactive
      2:
        food.DRINKS_SODA.FantaSaborNaranja2L: 3 # train
        food.BEER.DuffBeerCan: 4 # test OOD

        food.ENERGY_DRINKS.MonsterEnergyDrink: 4 # inactive
      3:
        food.drinks.coffeePackaging: 3 # inactive
        food.CRACKERS_COOKIES.OreoLemonCremeSandwichCookies: 3 # inactive
        food.CRACKERS_COOKIES.BarryCallebautMilkChockolateChunks: 3 # inactive
      
inactive_shelvings_list:
  - fixtures.shelf
  - fixtures.shelf_metal
  - fixtures.small_shelf_two_sided

inactive_wall_shelvings_list:
  - fixtures.freezer_large_filled

scene_fixtures_list: 
  - fixtures.pile_of_pallets
  - fixtures.pallets_and_boxes
  - fixtures.freezer_nestle


fake_arrangements_mapping:
  fixtures.shelf:
    - fixtures.shelf_fake_1
    - fixtures.shelf_fake_2
    - fixtures.shelf_fake_3
  fixtures.shelf_metal:
    - fixtures.shelf_metal_fake_1
    - fixtures.shelf_metal_fake_2
  fixtures.small_shelf_two_sided:
    - fixtures.small_shelf_two_sided_fake_1
    - fixtures.small_shelf_two_sided_fake_1
  